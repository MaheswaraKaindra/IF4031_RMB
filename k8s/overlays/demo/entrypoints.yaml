# Stable external entry points on every node (kube-proxy balances across Ready endpoints only, so unhealthy
# instances stop receiving traffic). The aggregator entry is the Audit/Analytics access point (port 3001 ONLY: the
# unauthenticated M1 internal API on :3000 is never published).
apiVersion: v1
kind: Service
metadata: {name: client-api-external, labels: {app.kubernetes.io/name: client-api, role: api}}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: client-api}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata: {name: auth-service-external, labels: {app.kubernetes.io/name: auth-service, role: api}}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: auth-service}
  ports: [{name: http, port: 8090, targetPort: http, nodePort: 30090}]
---
apiVersion: v1
kind: Service
metadata: {name: aggregator-external, labels: {app.kubernetes.io/name: aggregator, role: aggregator}}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: aggregator}
  ports: [{name: audit, port: 3001, targetPort: audit, nodePort: 30000}]
