# Trace backend. In-memory storage with a trace cap so the 256Mi limit holds; traces are lost on restart (acceptable
# for the demo, the evidence is captured live). Services export OTLP to http://jaeger:4318 (docs/m2/observability.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels: {app.kubernetes.io/name: jaeger, role: other}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: jaeger}
  template:
    metadata:
      labels: {app.kubernetes.io/name: jaeger, role: other}
    spec:
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/all-in-one:1.62.0
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: MEMORY_MAX_TRACES, value: "2000"}
          ports:
            - {name: ui, containerPort: 16686}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: ui}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: ui}
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, labels: {app.kubernetes.io/name: jaeger, role: other}}
spec:
  selector: {app.kubernetes.io/name: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: ui}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
