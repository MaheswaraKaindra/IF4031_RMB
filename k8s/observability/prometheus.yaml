apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: bnpb-prometheus}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: bnpb-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bnpb-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: sistem-informasi-kebencanaan-bnpb}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    scrape_configs:
      # Application pods that opt in with annotations prometheus.io/scrape=true, prometheus.io/port=<port>
      # (contract: docs/m2-details/observability.md; services expose /metrics with http_requests_total and http_request_duration_seconds).
      - job_name: bnpb-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [sistem-informasi-kebencanaan-bnpb]}
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep}
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], target_label: service}
          - {source_labels: [__meta_kubernetes_pod_label_role], target_label: role}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
          - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
      # Container memory/CPU per pod from the kubelet's cAdvisor: memory against the Appendix B limits.
      - job_name: cadvisor
        scheme: https
        tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
        authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {target_label: __address__, replacement: kubernetes.default.svc:443}
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - {source_labels: [__meta_kubernetes_node_name], target_label: node}
        metric_relabel_configs:
          - {source_labels: [__name__], regex: "container_(memory_working_set_bytes|memory_rss|cpu_usage_seconds_total|oom_events_total|spec_memory_limit_bytes)", action: keep}
          - {source_labels: [namespace], regex: sistem-informasi-kebencanaan-bnpb, action: keep}
          - {source_labels: [container], regex: "", action: drop}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, role: other}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus, role: other}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3h     # bounded: the container limit is 256Mi
            - --storage.tsdb.wal-compression
          ports: [{name: http, containerPort: 9090}]
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, labels: {app.kubernetes.io/name: prometheus, role: other}}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
