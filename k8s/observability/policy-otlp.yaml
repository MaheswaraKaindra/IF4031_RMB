apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-otlp-to-jaeger}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: jaeger}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
