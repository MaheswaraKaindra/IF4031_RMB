# Sensor Pantai (black box from the assistants). Adapted from the official example manifest ONLY by:
# namespace (via kustomize), Appendix B resources ("other" class), a Service, and the Secret/profile wiring.
# The image digest is pinned and must not change. Secret pantai-token (key "token") comes from create-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-pantai
  labels: {app.kubernetes.io/name: sensor-pantai, role: sensor}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: sensor-pantai}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sensor-pantai, role: sensor}
    spec:
      containers:
        - name: sensor
          image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: PANTAI_PROFILE, value: practice}   # exam profile is selected by the assistants at demo time
            - {name: PANTAI_SEED, value: "42"}
            - {name: PANTAI_SPEED, value: "60"}
            - name: PANTAI_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: pantai-token, key: token}}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-pantai
  labels: {app.kubernetes.io/name: sensor-pantai, role: sensor}
spec:
  selector: {app.kubernetes.io/name: sensor-pantai}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Consumers of the sensor (Owner C's adapter) live in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sensor-from-namespace
spec:
  podSelector: {matchLabels: {role: sensor}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8080}]
