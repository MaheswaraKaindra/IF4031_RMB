# One image (bnpb/consumers), three entrypoints, same as docker-compose. Secret consumers-secret
# (RABBITMQ_URL) is created by scripts/k8s/create-secrets.sh. Health port serves /health only and
# returns 503 while the broker connection is down, so liveness is a TCP check (a broker outage
# must not restart-loop the consumers) and readiness uses /health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-notifier
  labels: {app.kubernetes.io/name: consumer-notifier, role: consumer}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: consumer-notifier}
  template:
    metadata:
      labels: {app.kubernetes.io/name: consumer-notifier, role: consumer}
    spec:
      containers:
        - name: consumer
          image: bnpb/consumers
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/notifier.js"]
          ports: [{name: health, containerPort: 8095}]
          envFrom:
            - configMapRef: {name: consumers-config}
            - secretRef: {name: consumers-secret}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}
          startupProbe:
            tcpSocket: {port: health}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: health}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: health}
            periodSeconds: 10
            failureThreshold: 3
---
