apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - workload.yaml
configMapGenerator:
  - name: consumers-config
    literals:
      - HEALTH_PORT=8095
      - AGGREGATOR_URL=http://aggregator-ack:3000
      - ACK_TIMEOUT_MS=1000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_LEVEL=info
