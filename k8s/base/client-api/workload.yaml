# Secret client-api-secret (JWT_PUBLIC_KEY_B64) is created by scripts/k8s/create-secrets.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api
  labels: {app.kubernetes.io/name: client-api, role: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: client-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: client-api, role: api}
    spec:
      containers:
        - name: client-api
          image: bnpb/client-api
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: client-api-config}
            - secretRef: {name: client-api-secret}
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: client-api
  labels: {app.kubernetes.io/name: client-api, role: api}
spec:
  selector: {app.kubernetes.io/name: client-api}
  ports: [{name: http, port: 8080, targetPort: http}]
