apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - workload.yaml
configMapGenerator:
  - name: client-api-config
    literals:
      - CLIENT_API_PORT=8080
      - AGGREGATOR_URL=http://aggregator:3000
      - AGGREGATOR_TIMEOUT_MS=2000
      - STALE_AFTER_MS=10000
      - MAX_IN_FLIGHT=100
      - JWT_ISSUER=bnpb-auth
      - JWT_AUDIENCE=bnpb-client-api
      - LOG_LEVEL=info
