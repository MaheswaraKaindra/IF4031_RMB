apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is fixed by the M2 spec (Tester Agent RBAC targets it by name).
namespace: sistem-informasi-kebencanaan-bnpb

resources:
  - namespace.yaml
  - mock-bmkg
  - mock-pvmbg
  - mongo
  - rabbitmq
  - aggregator
  - client-api
  - auth-service
  - consumers
  - policy

labels:
  - pairs:
      app.kubernetes.io/part-of: bnpb
    includeSelectors: false
    includeTemplates: true
