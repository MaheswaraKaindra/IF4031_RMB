# Secret aggregator-secret (X_BMKG_KEY, PVMBG_TOKEN, MONGO_URI, RABBITMQ_URL) is created by
# scripts/k8s/create-secrets.sh.
#
# replicas MUST stay 1 until Owner B's P2 leader election + fenced commit lands: the M1 poller has
# no coordination, so >1 instance polls the sources multiple times and duplicates work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  labels: {app.kubernetes.io/name: aggregator, role: aggregator}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: aggregator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aggregator, role: aggregator}
    spec:
      # The aggregator exits(1) if its first Mongo connect fails (index.ts), which would crash-loop with a growing
      # backoff on a cold cluster.
      initContainers:
        - name: wait-for-deps
          image: docker.io/library/busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z mongo 27017 && nc -z rabbitmq 5672; do echo waiting for mongo/rabbitmq; sleep 2; done"]
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: aggregator
          image: bnpb/aggregator
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}    # M1 internal API (unauthenticated): client-api only
            - {name: audit, containerPort: 3001}   # Audit API + analytics (token-protected): the only published entry
          envFrom:
            - configMapRef: {name: aggregator-config}
            - secretRef: {name: aggregator-secret}
          resources:
            requests: {memory: 256Mi, cpu: 200m}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          # /health returns 503 when Mongo is unreachable: that must drain traffic, not restart the pod.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  labels: {app.kubernetes.io/name: aggregator, role: aggregator}
spec:
  selector: {app.kubernetes.io/name: aggregator}
  ports: [{name: http, port: 3000, targetPort: http}]
---
# Token-protected Audit/analytics API (Appendix A). The load balancer / NodePort entry points here, never at :3000.
apiVersion: v1
kind: Service
metadata:
  name: aggregator-audit
  labels: {app.kubernetes.io/name: aggregator, role: aggregator}
spec:
  selector: {app.kubernetes.io/name: aggregator}
  ports: [{name: audit, port: 3001, targetPort: audit}]
