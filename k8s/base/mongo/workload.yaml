# Single-node MongoDB for the dev overlay only (M1 behaviour). The demo overlay deletes it and uses the sharded store in k8s/store.
# Secret mongo-secret (MONGO_INITDB_ROOT_USERNAME/PASSWORD) comes from scripts/k8s/create-secrets.sh.
# Data lives on the node-local default StorageClass (k3s local-path / kind standard), never network storage.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels: {app.kubernetes.io/name: mongo, role: store}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mongo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongo, role: store}
    spec:
      containers:
        - name: mongo
          image: docker.io/library/mongo:7
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports: [{name: mongo, containerPort: 27017}]
          envFrom:
            - secretRef: {name: mongo-secret}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
          startupProbe:
            exec: {command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: {app.kubernetes.io/name: mongo, role: store}
spec:
  selector: {app.kubernetes.io/name: mongo}
  ports: [{name: mongo, port: 27017, targetPort: mongo}]
