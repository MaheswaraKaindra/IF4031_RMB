# Single RabbitMQ node (M1 behaviour). Broker HA/clustering is Owner B's P3 decision.
# Secret rabbitmq-secret (RABBITMQ_DEFAULT_USER/PASS) comes from scripts/k8s/create-secrets.sh.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq, role: broker}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, role: broker}
    spec:
      # A fresh volume is root-owned: without fsGroup the first start cannot write .erlang.cookie. OnRootMismatch keeps the
      # kubelet from re-applying group-write to the existing cookie on every restart (RabbitMQ refuses a cookie that is
      # not owner-only, so a restart or a node reboot would otherwise crash-loop the broker).
      securityContext: {fsGroup: 101, fsGroupChangePolicy: OnRootMismatch}   # rabbitmq in the -alpine image is uid 100 / gid 101
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:4-management-alpine
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          envFrom:
            - secretRef: {name: rabbitmq-secret}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
          startupProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: amqp}
            periodSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app.kubernetes.io/name: rabbitmq, role: broker}
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
