apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Opt-in component (not part of base): the sharded P1 store. Included by overlays/demo.
# Needs Secrets mongo-secret, mongo-keyfile, store-users (scripts/k8s/create-secrets.sh) and node labels
# bnpb.io/store-slot=1..3 (scripts/k8s/label-nodes.sh).
resources:
  - members.yaml
  - mongos.yaml
  - init-job.yaml
  - policy.yaml
  - mongo-exporter.yaml
configMapGenerator:
  - name: store-init-script
    files:
      - init.js
generatorOptions:
  disableNameSuffixHash: true
