# Query routers. Stateless; they need the config replica set to be initiated (done by the store-init Job),
# so an init container waits for a config primary instead of crash-looping with a growing backoff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongos
  labels: {app.kubernetes.io/name: mongos, role: other, bnpb.io/store: "true"}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: mongos}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongos, role: other, bnpb.io/store: "true"}
    spec:
      initContainers:
        - name: wait-config-primary
          image: docker.io/library/mongo:4.4
          command:
            - sh
            - -c
            - |
              until mongo --quiet --host mongo-cfg-1-0.mongo-cfg-1 --eval 'quit(db.isMaster().ismaster ? 0 : 1)' ||
                    mongo --quiet --host mongo-cfg-2-0.mongo-cfg-2 --eval 'quit(db.isMaster().ismaster ? 0 : 1)' ||
                    mongo --quiet --host mongo-cfg-3-0.mongo-cfg-3 --eval 'quit(db.isMaster().ismaster ? 0 : 1)'; do
                echo "waiting for config replica set primary"; sleep 3
              done
              cp /keyfile-src/keyfile /keyfile/keyfile && chown 999:999 /keyfile/keyfile && chmod 400 /keyfile/keyfile
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: keyfile-src, mountPath: /keyfile-src, readOnly: true}
            - {name: keyfile, mountPath: /keyfile}
      containers:
        - name: mongos
          image: docker.io/library/mongo:4.4
          command: ["mongos"]
          args:
            - --configdb
            - cfg/mongo-cfg-1-0.mongo-cfg-1:27017,mongo-cfg-2-0.mongo-cfg-2:27017,mongo-cfg-3-0.mongo-cfg-3:27017
            - --bind_ip_all
            - --keyFile
            - /keyfile/keyfile
          ports: [{name: mongo, containerPort: 27017}]
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: keyfile, mountPath: /keyfile}
          startupProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mongo}
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: keyfile-src
          secret: {secretName: mongo-keyfile}
        - name: keyfile
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mongos
  labels: {app.kubernetes.io/name: mongos, role: other, bnpb.io/store: "true"}
spec:
  selector: {app.kubernetes.io/name: mongos}
  ports: [{name: mongo, port: 27017, targetPort: mongo}]
---
# Headless twin of the `mongos` Service: its SRV record (_mongo._tcp.mongos-direct) lists the Ready mongos pods one by one, so the aggregator's
# driver tracks BOTH routers itself (1 s heartbeat) and stops using one that died with its node, instead of the ClusterIP that keeps sending
# connections to the dead pod until its endpoint is removed (about 16-25 s).
apiVersion: v1
kind: Service
metadata:
  name: mongos-direct
  labels: {app.kubernetes.io/name: mongos, role: other, bnpb.io/store: "true"}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mongos}
  ports: [{name: mongo, port: 27017, targetPort: mongo}]
