# Test double for the Sensor Pantai contract. Not part of any overlay: apply by hand for resilience tests, never in the demo.
# It reuses the aggregator image (dist/tools/fake-sensor.js) and the pantai-token secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-fake
  labels: {app.kubernetes.io/name: sensor-fake, role: other}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sensor-fake}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sensor-fake, role: other}
    spec:
      containers:
        - name: fake
          image: bnpb/aggregator:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/tools/fake-sensor.js"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: PANTAI_AUTH_TOKEN
              valueFrom: {secretKeyRef: {name: pantai-token, key: token}}
          resources:
            requests: {memory: 64Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-fake
  labels: {app.kubernetes.io/name: sensor-fake, role: other}
spec:
  selector: {app.kubernetes.io/name: sensor-fake}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sensor-fake-from-namespace
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sensor-fake}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8080}]
